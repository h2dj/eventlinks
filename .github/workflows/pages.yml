name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Settings > Pages > Source 를 "GitHub Actions"로 바꿔둔 경우, main에 push될 때마다
  # 이 워크플로가 저장소 루트(index.html 등)를 그대로 GitHub Pages에 배포합니다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 두 배포가 겹치지 않도록 함 (진행 중인 배포는 취소하지 않고 대기)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
